[package]
name = "borge_equipment_rental"
version = "0.1.0"
description = "Modular Quotation & Equipment Hire Management System for Borge"
authors = ["Borge Team"]
edition = "2021"

[lib]
name = "borge_equipment_rental_lib"
crate-type = ["lib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
