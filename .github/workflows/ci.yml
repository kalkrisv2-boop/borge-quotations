name: Dual-Target Build Check

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  web-build:
    name: Web Target Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build web target
        run: npm run web:build

  desktop-build:
    name: Tauri Desktop Target Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (WebView/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Cargo check (src-tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml
