<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Quotation & Equipment Hire System</title>
</head>
<body>
  <div id="app">
    <h1>Modular Quotation System Scaffold</h1>
    <p id="status">Checking runtime environment...</p>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('status');
      if (statusEl) {
        const isTauri = !!(window.__TAURI_INTERNALS__ || window.__TAURI_IPC__ || window.__TAURI__);
        if (isTauri) {
          statusEl.textContent = 'Runtime detected: Desktop Shell (Tauri v2 native bridge active)';
        } else {
          statusEl.textContent = 'Runtime detected: Web Application target (browser fallback active)';
        }
      }
    });
  </script>
</body>
</html>
